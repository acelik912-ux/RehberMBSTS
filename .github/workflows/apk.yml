name: APK oluştur

# main dalına her gönderimde çalışır; "Actions > APK oluştur > Run workflow" ile elle de başlatılabilir.
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'CLAUDE.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android dosyalarını oluştur
        run: |
          flutter create --platforms=android --project-name rehber_mbsts --org com.acelik912 .
          python3 tool/patch_android.py

      - run: flutter pub get

      - name: Kod kontrolü
        run: flutter analyze --no-fatal-infos lib test

      - name: Testler (içerik bağlantıları + ekran)
        run: flutter test

      - name: APK derle
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: İmza kontrolü
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -q "CN=RehberMBSTS" || (echo "HATA: sabit anahtarla imzalanmadı" && exit 1)
          ls -la build/app/outputs/flutter-apk/

      - name: APK'yı adlandır
        run: cp build/app/outputs/flutter-apk/app-release.apk rehber-mbsts-${{ github.run_number }}.apk

      - name: Sürüm sayfasına koy
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Rehber MBSTS 0.1.${{ github.run_number }}
          body: Telefona kurmak için aşağıdaki rehber-mbsts APK dosyasına dokunun. Yeni sürüm eskisinin üstüne kurulur, notlarınız silinmez.
          files: rehber-mbsts-${{ github.run_number }}.apk
          make_latest: true
