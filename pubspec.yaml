name: rehber_mbsts
description: "Rehber MBSTS - Diyanet MBSTS sınavı için bağlantılı konu rehberi, kişisel notlar ve tekrar kartları."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  share_plus: ^10.1.4
  file_selector: ^1.0.3
  archive: ^3.6.1
  flutter_tts: ^4.2.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/content/
    - assets/sema/
